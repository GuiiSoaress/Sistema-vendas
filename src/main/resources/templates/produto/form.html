<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${produto.id == null} ? 'Novo produto' : 'Editar produto')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('produtos')}"></nav>
<main class="container py-4" style="max-width:720px">
    <h1 class="page-title h3 mb-3" th:text="${produto.id == null} ? 'Novo produto' : 'Editar produto'"></h1>
    <form class="card card-body" th:action="@{${produto.id == null} ? '/produtos/novo' : '/produtos/edit/' + ${produto.id}}" th:object="${produto}" method="post">
        <div class="row g-3">
            <div class="col-12">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" th:field="*{nome}">
                <div class="text-danger small" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
            </div>
            <div class="col-12">
                <label for="descricao" class="form-label">Descrição</label>
                <input type="text" class="form-control" id="descricao" th:field="*{descricao}">
                <div class="text-danger small" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></div>
            </div>
            <div class="col-md-6">
                <label for="preco" class="form-label">Preço (R$)</label>
                <input type="number" step="0.01" class="form-control" id="preco" th:field="*{preco}">
                <div class="text-danger small" th:if="${#fields.hasErrors('preco')}" th:errors="*{preco}"></div>
            </div>
            <div class="col-md-6">
                <label for="quantidadeEmEstoque" class="form-label">Quantidade em estoque</label>
                <input type="number" class="form-control" id="quantidadeEmEstoque" th:field="*{quantidadeEmEstoque}">
                <div class="text-danger small" th:if="${#fields.hasErrors('quantidadeEmEstoque')}" th:errors="*{quantidadeEmEstoque}"></div>
            </div>
        </div>
        <div class="mt-4">
            <button type="submit" class="btn btn-primary">Salvar produto</button>
            <a th:href="@{/produtos}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
