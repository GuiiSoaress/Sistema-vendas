
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:unless="${cliente.id == null}">Edição de Cliente</title>
    <title th:if="${cliente.id == null}">Cadastro de Cliente</title>

    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2 th:text="${cliente.id == null} ? 'Novo Cliente' : 'Editar Cliente'"></h2>

    <form th:action="@{${cliente.id == null} ? '/clientes/novo' : '/clientes/edit/' + ${cliente.id}}"
          th:object="${cliente}"
          method="post">

        <!-- Nome -->
        <div class="mb-3">
            <label for="nome" class="form-label">Nome completo</label>
            <input type="text" class="form-control" id="nome" th:field="*{nome}">
            <div class="text-danger"
                 th:if="${#fields.hasErrors('nome')}"
                 th:errors="*{nome}">
            </div>
        </div>

        <!-- E-mail -->
        <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" class="form-control" id="email" th:field="*{email}">
            <div class="text-danger"
                 th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}">
            </div>
        </div>

        <!-- CPF -->
        <div class="mb-3">
            <label for="cpf" class="form-label">CPF</label>
            <input type="text" class="form-control" id="cpf" th:field="*{cpf}">
            <div class="text-danger"
                 th:if="${#fields.hasErrors('cpf')}"
                 th:errors="*{cpf}">
            </div>
        </div>

        <!-- Telefone -->
        <div class="mb-3">
            <label for="telefone" class="form-label">Telefone</label>
            <input type="text" class="form-control" id="telefone" th:field="*{telefone}">
            <div class="text-danger"
                 th:if="${#fields.hasErrors('telefone')}"
                 th:errors="*{telefone}">
            </div>
        </div>

        <h4 class="mt-4 mb-3">Endereço</h4>

        <!-- Logradouro -->
        <div class="mb-3">
            <label for="logradouro" class="form-label">Logradouro</label>
            <input type="text" class="form-control" id="logradouro" th:field="*{logradouro}">
            <div class="text-danger"
                 th:if="${#fields.hasErrors('logradouro')}"
                 th:errors="*{logradouro}">
            </div>
        </div>

        <!-- Número -->
        <div class="mb-3">
            <label for="numero" class="form-label">Número</label>
            <input type="text" class="form-control" id="numero" th:field="*{numero}">
            <div class="text-danger"
                 th:if="${#fields.hasErrors('numero')}"
                 th:errors="*{numero}">
            </div>
        </div>

        <!-- Complemento -->
        <div class="mb-3">
            <label for="complemento" class="form-label">Complemento</label>
            <input type="text" class="form-control" id="complemento" th:field="*{complemento}">
            <div class="text-danger"
                 th:if="${#fields.hasErrors('complemento')}"
                 th:errors="*{complemento}">
            </div>
        </div>

        <!-- Bairro -->
        <div class="mb-3">
            <label for="bairro" class="form-label">Bairro</label>
            <input type="text" class="form-control" id="bairro" th:field="*{bairro}">
            <div class="text-danger"
                 th:if="${#fields.hasErrors('bairro')}"
                 th:errors="*{bairro}">
            </div>
        </div>

        <!-- Cidade -->
        <div class="mb-3">
            <label for="cidade" class="form-label">Cidade</label>
            <input type="text" class="form-control" id="cidade" th:field="*{cidade}">
            <div class="text-danger"
                 th:if="${#fields.hasErrors('cidade')}"
                 th:errors="*{cidade}">
            </div>
        </div>

        <!-- UF -->
        <div class="mb-3">
            <label for="uf" class="form-label">UF</label>

            <select class="form-control" id="uf" th:field="*{uf}">
                <option value="">Selecione</option>
                <option value="AC">AC</option>
                <option value="AL">AL</option>
                <option value="AP">AP</option>
                <option value="AM">AM</option>
                <option value="BA">BA</option>
                <option value="CE">CE</option>
                <option value="DF">DF</option>
                <option value="ES">ES</option>
                <option value="GO">GO</option>
                <option value="MA">MA</option>
                <option value="MT">MT</option>
                <option value="MS">MS</option>
                <option value="MG">MG</option>
                <option value="PA">PA</option>
                <option value="PB">PB</option>
                <option value="PR">PR</option>
                <option value="PE">PE</option>
                <option value="PI">PI</option>
                <option value="RJ">RJ</option>
                <option value="RN">RN</option>
                <option value="RS">RS</option>
                <option value="RO">RO</option>
                <option value="RR">RR</option>
                <option value="SC">SC</option>
                <option value="SP">SP</option>
                <option value="SE">SE</option>
                <option value="TO">TO</option>
            </select>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('uf')}"
                 th:errors="*{uf}">
            </div>
        </div>

        <!-- CEP -->
        <div class="mb-3">
            <label for="cep" class="form-label">CEP</label>
            <input type="text" class="form-control" id="cep" th:field="*{cep}">
            <div class="text-danger"
                 th:if="${#fields.hasErrors('cep')}"
                 th:errors="*{cep}">
            </div>
        </div>

        <button type="submit" class="btn btn-primary">
            Salvar
        </button>

        <a th:href="@{/clientes}" class="btn btn-secondary">
            Cancelar
        </a>

    </form>

</div>

</body>
</html>
