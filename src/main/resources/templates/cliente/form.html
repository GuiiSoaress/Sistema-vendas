<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${cliente.id == null} ? 'Novo cliente' : 'Editar cliente')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('clientes')}"></nav>
<main class="container py-4" style="max-width:820px">
    <h1 class="page-title h3 mb-3" th:text="${cliente.id == null} ? 'Novo cliente' : 'Editar cliente'"></h1>
    <form class="card card-body" th:action="@{${cliente.id == null} ? '/clientes/novo' : '/clientes/edit/' + ${cliente.id}}" th:object="${cliente}" method="post">
        <div class="row g-3">
            <div class="col-md-8">
                <label for="nome" class="form-label">Nome completo</label>
                <input type="text" class="form-control" id="nome" th:field="*{nome}">
                <div class="text-danger small" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
            </div>
            <div class="col-md-4">
                <label for="cpf" class="form-label">CPF</label>
                <input type="text" class="form-control" id="cpf" th:field="*{cpf}">
                <div class="text-danger small" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></div>
            </div>
            <div class="col-md-8">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" th:field="*{email}">
                <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="col-md-4">
                <label for="telefone" class="form-label">Telefone</label>
                <input type="text" class="form-control" id="telefone" th:field="*{telefone}">
                <div class="text-danger small" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></div>
            </div>

            <div class="col-12"><hr class="my-1"><h2 class="h6 mb-0">Endereço</h2></div>

            <div class="col-md-8">
                <label for="logradouro" class="form-label">Logradouro</label>
                <input type="text" class="form-control" id="logradouro" th:field="*{logradouro}">
                <div class="text-danger small" th:if="${#fields.hasErrors('logradouro')}" th:errors="*{logradouro}"></div>
            </div>
            <div class="col-md-4">
                <label for="numero" class="form-label">Número</label>
                <input type="text" class="form-control" id="numero" th:field="*{numero}">
            </div>
            <div class="col-md-4">
                <label for="complemento" class="form-label">Complemento</label>
                <input type="text" class="form-control" id="complemento" th:field="*{complemento}">
            </div>
            <div class="col-md-8">
                <label for="bairro" class="form-label">Bairro</label>
                <input type="text" class="form-control" id="bairro" th:field="*{bairro}">
                <div class="text-danger small" th:if="${#fields.hasErrors('bairro')}" th:errors="*{bairro}"></div>
            </div>
            <div class="col-md-6">
                <label for="cidade" class="form-label">Cidade</label>
                <input type="text" class="form-control" id="cidade" th:field="*{cidade}">
                <div class="text-danger small" th:if="${#fields.hasErrors('cidade')}" th:errors="*{cidade}"></div>
            </div>
            <div class="col-md-2">
                <label for="uf" class="form-label">UF</label>
                <input type="text" class="form-control" id="uf" th:field="*{uf}">
                <div class="text-danger small" th:if="${#fields.hasErrors('uf')}" th:errors="*{uf}"></div>
            </div>
            <div class="col-md-4">
                <label for="cep" class="form-label">CEP</label>
                <input type="text" class="form-control" id="cep" th:field="*{cep}">
                <div class="text-danger small" th:if="${#fields.hasErrors('cep')}" th:errors="*{cep}"></div>
            </div>
        </div>
        <div class="mt-4">
            <button type="submit" class="btn btn-primary">Salvar cliente</button>
            <a th:href="@{/clientes}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
