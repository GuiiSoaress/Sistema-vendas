<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Editar pedido')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('pedidos')}"></nav>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="page-title h3 mb-0">Pedido <span th:text="'#' + ${pedido.id}"></span> <span th:replace="~{fragments/layout :: status(${pedido})}"></span></h1>
        <a class="btn btn-primary" th:href="@{/pedidos/detalhes/{id}(id=${pedido.id})}">Concluir edição</a>
    </div>
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="row g-3 mb-3">
        <div class="col-md-4"><div class="card card-body"><div class="text-secondary small">Cliente</div><div class="fw-semibold" th:text="${pedido.cliente.nome}"></div></div></div>
        <div class="col-md-4"><div class="card card-body"><div class="text-secondary small">Data</div><div class="fw-semibold" th:text="${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy HH:mm')}"></div></div></div>
        <div class="col-md-4"><div class="card card-body"><div class="text-secondary small">Valor total</div><div class="fw-semibold" th:text="${#numbers.formatCurrency(pedido.valorTotal)}"></div></div></div>
    </div>

    <div class="card mb-3">
        <div class="card-header">Adicionar produto</div>
        <div class="card-body">
            <form class="row g-3 align-items-end" th:action="@{/pedidos/{id}/adicionar-item(id=${pedido.id})}" method="post">
                <div class="col-md-6">
                    <label for="produtoId" class="form-label">Produto</label>
                    <select class="form-select" id="produtoId" name="produtoId" required>
                        <option value="">Selecione um produto</option>
                        <option th:each="produto : ${produtos}" th:value="${produto.id}"
                                th:disabled="${produto.quantidadeEmEstoque <= 0}"
                                th:text="${produto.nome + ' - ' + #numbers.formatCurrency(produto.preco) + ' - estoque: ' + produto.quantidadeEmEstoque}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="quantidade" class="form-label">Quantidade</label>
                    <input type="number" class="form-control" id="quantidade" name="quantidade" min="1" value="1" required>
                </div>
                <div class="col-md-3"><button type="submit" class="btn btn-primary w-100">Adicionar ao pedido</button></div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-header">Itens do pedido</div>
        <div class="table-responsive" th:unless="${#lists.isEmpty(pedido.itens)}">
            <table class="table mb-0">
                <thead><tr><th>Produto</th><th>Qtd.</th><th>Preço unitário</th><th>Subtotal</th><th class="text-end">Ações</th></tr></thead>
                <tbody>
                <tr th:each="item : ${pedido.itens}">
                    <td th:text="${item.produto.nome}"></td>
                    <td th:text="${item.quantidade}"></td>
                    <td th:text="${#numbers.formatCurrency(item.precoUnitario)}"></td>
                    <td th:text="${#numbers.formatCurrency(item.precoUnitario * item.quantidade)}"></td>
                    <td class="text-end">
                        <form th:action="@{/pedidos/{pid}/remover-item/{iid}(pid=${pedido.id}, iid=${item.id})}" method="post">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Remover</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card-body text-secondary" th:if="${#lists.isEmpty(pedido.itens)}">Nenhum produto no pedido. Escolha um produto acima para começar.</div>
    </div>

    <a class="btn btn-link mt-3 px-0" th:href="@{/pedidos}">Voltar para pedidos</a>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
