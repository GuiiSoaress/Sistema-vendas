<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalhes do pedido')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('pedidos')}"></nav>
<main class="container py-4">
    <h1 class="page-title h3 mb-3">Pedido <span th:text="'#' + ${pedido.id}"></span> <span th:replace="~{fragments/layout :: status(${pedido})}"></span></h1>
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="row g-3 mb-3">
        <div class="col-md-6"><div class="card card-body">
            <div class="text-secondary small">Cliente</div>
            <div class="fw-semibold" th:text="${pedido.cliente.nome}"></div>
            <div class="small" th:text="'CPF ' + ${pedido.cliente.cpf} + ' - ' + ${pedido.cliente.email}"></div>
        </div></div>
        <div class="col-md-3"><div class="card card-body"><div class="text-secondary small">Data</div><div class="fw-semibold" th:text="${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy HH:mm')}"></div></div></div>
        <div class="col-md-3"><div class="card card-body"><div class="text-secondary small">Valor total</div><div class="fw-semibold" th:text="${#numbers.formatCurrency(pedido.valorTotal)}"></div></div></div>
    </div>

    <div class="card">
        <div class="card-header">Produtos</div>
        <div class="table-responsive" th:unless="${#lists.isEmpty(pedido.itens)}">
            <table class="table mb-0">
                <thead><tr><th>Produto</th><th>Descrição</th><th>Qtd.</th><th>Preço unitário</th><th>Subtotal</th></tr></thead>
                <tbody>
                <tr th:each="item : ${pedido.itens}">
                    <td th:text="${item.produto.nome}"></td>
                    <td th:text="${item.produto.descricao}"></td>
                    <td th:text="${item.quantidade}"></td>
                    <td th:text="${#numbers.formatCurrency(item.precoUnitario)}"></td>
                    <td th:text="${#numbers.formatCurrency(item.precoUnitario * item.quantidade)}"></td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card-body text-secondary" th:if="${#lists.isEmpty(pedido.itens)}">Este pedido não tem produtos.</div>
    </div>

    <div class="mt-3">
        <a class="btn btn-outline-secondary" th:href="@{/pedidos}">Voltar para pedidos</a>
        <a class="btn btn-outline-primary" th:if="${pedido.status.name() == 'ATIVO'}" th:href="@{/pedidos/edit/{id}(id=${pedido.id})}">Editar pedido</a>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
