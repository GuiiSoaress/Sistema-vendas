<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cancelar pedido')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('pedidos')}"></nav>
<main class="container py-4" style="max-width:720px">
    <h1 class="page-title h3 mb-3">Cancelar pedido <span th:text="'#' + ${pedido.id}"></span></h1>
    <div class="alert alert-warning">Os produtos voltam para o estoque e o cancelamento não pode ser desfeito.</div>
    <table class="table table-bordered bg-white">
        <tr><th class="w-25">Cliente</th><td th:text="${pedido.cliente.nome}"></td></tr>
        <tr><th>Data</th><td th:text="${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy HH:mm')}"></td></tr>
        <tr><th>Valor total</th><td th:text="${#numbers.formatCurrency(pedido.valorTotal)}"></td></tr>
        <tr><th>Itens</th><td th:text="${pedido.itens.size()}"></td></tr>
    </table>
    <form th:action="@{/pedidos/cancelar/{id}(id=${pedido.id})}" method="post">
        <button type="submit" class="btn btn-danger">Cancelar pedido</button>
        <a th:href="@{/pedidos}" class="btn btn-outline-secondary">Voltar</a>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
